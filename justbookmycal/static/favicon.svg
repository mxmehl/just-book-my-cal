<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Calendar">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#1f5fd6"/>
    </linearGradient>
  </defs>
  <!-- calendar sheet -->
  <rect x="4" y="9" width="56" height="51" rx="9" fill="url(#body)"/>
  <!-- header band -->
  <path d="M4 18a9 9 0 0 1 9-9h38a9 9 0 0 1 9 9v7H4z" fill="#123f9c"/>
  <!-- binder rings -->
  <rect x="17" y="3" width="6" height="14" rx="3" fill="#eaf2ff"/>
  <rect x="41" y="3" width="6" height="14" rx="3" fill="#eaf2ff"/>
  <!-- days; one of them is the booked one -->
  <g fill="#eaf2ff" fill-opacity="0.4">
    <rect x="12" y="31" width="10" height="10" rx="2.5"/>
    <rect x="27" y="31" width="10" height="10" rx="2.5"/>
    <rect x="42" y="31" width="10" height="10" rx="2.5"/>
    <rect x="12" y="45" width="10" height="10" rx="2.5"/>
    <rect x="42" y="45" width="10" height="10" rx="2.5"/>
  </g>
  <rect x="27" y="45" width="10" height="10" rx="2.5" fill="#ffffff"/>
</svg>
